[workspace]
resolver = "2"
members = [
    "fstrace",
    "fstrace-common",
    "fstrace-ebpf",
    "tests/vmtest",
    "xtask",
]
default-members = ["fstrace", "fstrace-common", "xtask"]

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2024"
repository = "https://github.com/bmiddha/fstrace"
authors = ["Bharat Middha <5100938+bmiddha@users.noreply.github.com>"]

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
clap = { version = "4.5.20", default-features = false, features = ["std", "derive"] }
libc = { version = "0.2.159", default-features = false }
nix = { version = "0.29", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.fstrace-ebpf]
debug = 2
codegen-units = 1
strip = false
