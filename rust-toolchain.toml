# The eBPF crate is compiled to the `bpfel-unknown-none` target using
# `-Z build-std`, which requires a nightly toolchain with the `rust-src`
# component. Pinning nightly for the whole workspace keeps builds reproducible.
[toolchain]
channel = "nightly-2026-11-06"
components = ["rust-src", "rustfmt", "clippy"]
